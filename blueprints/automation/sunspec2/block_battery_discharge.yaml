blueprint:
  name: "SunSpec: block battery discharging while a large consumer runs"
  description: >-
    Keeps the home battery from emptying itself into a large consumer, such
    as a car charger or a heat pump. While the consumer runs, the **Battery
    mode** is set to *Block discharging*. Afterwards it goes back to
    *Automatic*.


    Needs the **Battery mode** entity, which the integration offers for
    Fronius inverters with a battery.


    Read [the blueprint guide](https://github.com/hilman2/ha-sunspec2/blob/main/docs/blueprints.md#block-battery-discharging-while-a-large-consumer-runs)
    first.
  domain: automation
  author: hilman2
  source_url: https://github.com/hilman2/ha-sunspec2/blob/main/blueprints/automation/sunspec2/block_battery_discharge.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    battery_mode:
      name: Battery mode
      description: The **Battery mode** entity of the battery.
      selector:
        entity:
          filter:
            - integration: sunspec2
              domain: select
    load:
      name: Consumer
      description: >-
        What tells that the consumer runs: a switch or binary sensor that
        is on, or a sensor with its power.
      selector:
        entity:
          filter:
            - domain:
                - binary_sensor
                - switch
                - input_boolean
                - sensor
    power_threshold:
      name: Runs above this power
      description: >-
        Only for a power sensor: the consumer counts as running above this
        many watts.
      default: 1000
      selector:
        number:
          min: 0
          max: 100000
          step: 10
          unit_of_measurement: W
          mode: box
    stop_delay:
      name: Release the battery after
      description: >-
        How long the consumer has to be off before the battery goes back
        to *Automatic*. Bridges the pauses of a car charger.
      default: 5
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: min
    advanced:
      name: More
      icon: mdi:tune
      collapsed: true
      input:
        hold_mode:
          name: Mode while the consumer runs
          description: >-
            *Discharge limit* lets the battery help with the power you
            entered in **Battery discharge limit**.
          default: block_discharging
          selector:
            select:
              options:
                - label: Block discharging
                  value: block_discharging
                - label: Discharge limit
                  value: discharge_limit
        refresh:
          name: Select the mode again
          description: >-
            The inverter drops a mode after its **Battery rate revert
            time**. Choose a period at least a minute shorter than that
            time.
          default: "3"
          selector:
            select:
              options:
                - label: Never
                  value: "0"
                - label: Every 3 minutes
                  value: "3"
                - label: Every 5 minutes
                  value: "5"
                - label: Every 10 minutes
                  value: "10"
                - label: Every 15 minutes
                  value: "15"
                - label: Every 30 minutes
                  value: "30"
        notify:
          name: Notify
          description: >-
            Gets a message when the battery is held or released, and when
            the mode cannot be set.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: notify

mode: queued
max: 5
max_exceeded: silent

trigger_variables:
  t_load: !input load
  t_threshold: !input power_threshold
  t_refresh: !input refresh

triggers:
  - trigger: template
    id: "on"
    value_template: >-
      {{ (states(t_load) | float(0)
          * (1000 if state_attr(t_load, 'unit_of_measurement') == 'kW' else 1) > t_threshold)
         if t_load.startswith('sensor.') else is_state(t_load, 'on') }}
  - trigger: template
    id: "off"
    value_template: >-
      {{ not ((states(t_load) | float(0)
               * (1000 if state_attr(t_load, 'unit_of_measurement') == 'kW' else 1) > t_threshold)
              if t_load.startswith('sensor.') else is_state(t_load, 'on')) }}
    for:
      minutes: !input stop_delay
  # The inverter answers again.
  - trigger: state
    id: back
    entity_id: !input battery_mode
    from: unavailable
  - trigger: homeassistant
    id: start
    event: start
  # True for one minute in every period, so it fires once per period.
  - trigger: template
    id: refresh
    value_template: >-
      {{ t_refresh | int(0) > 0
         and (now().minute - 1) % (t_refresh | int(1)) == 0
         and ((states(t_load) | float(0)
               * (1000 if state_attr(t_load, 'unit_of_measurement') == 'kW' else 1) > t_threshold)
              if t_load.startswith('sensor.') else is_state(t_load, 'on')) }}

variables:
  battery_mode: !input battery_mode
  load: !input load
  power_threshold: !input power_threshold
  hold_mode: !input hold_mode
  notify_entities: !input notify
  # "manual" is a run started from the automation's menu.
  reason: "{{ trigger.id | default('manual') }}"
  mode_now: "{{ states(battery_mode) }}"
  # How long the battery has been in that mode, in seconds.
  mode_age: >-
    {{ (now() - states[battery_mode].last_changed).total_seconds()
       if states[battery_mode] is not none else 0 }}
  # The modes the inverter can report after this automation selected
  # its mode. A discharge limit of 0 W reads back as Block discharging.
  held_modes: >-
    {{ [hold_mode] + (['block_discharging'] if hold_mode == 'discharge_limit' else []) }}
  running: >-
    {{ (states(load) | float(0)
        * (1000 if state_attr(load, 'unit_of_measurement') == 'kW' else 1) > power_threshold)
       if load.startswith('sensor.') else is_state(load, 'on') }}
  # The mode to select, or none when this run has nothing to do.
  #
  # The battery is only taken over from Automatic, and only given back
  # from the mode this automation selects. A battery plan or another
  # mode chosen by hand stays as it is. An inverter that dropped the
  # mode and reports Automatic again gets the mode selected again. The
  # "refresh" run selects it before the inverter drops it, but not a
  # mode that was selected in this very minute.
  target: >-
    {{ hold_mode
       if running and (mode_now == 'auto'
                       or (reason == 'refresh' and mode_now in held_modes and mode_age >= 60))
       else ('auto' if not running and mode_now in held_modes
                       and reason in ['off', 'start', 'manual']
             else none) }}
  written: false
  wanted: true

conditions:
  - condition: template
    value_template: "{{ target is not none }}"

actions:
  # "Run actions" in the automation's menu skips the conditions above.
  - condition: template
    value_template: "{{ target is not none }}"
  # Two triggers can fire in the same moment, for example the refresh
  # and the one that starts the mode. The run that comes second finds
  # the mode already selected and has nothing left to do. Only a
  # refresh that found the mode selected when it fired selects it again.
  - condition: template
    value_template: >-
      {{ states(battery_mode) != 'auto' if target == 'auto'
         else (states(battery_mode) not in held_modes
               or (reason == 'refresh' and mode_now in held_modes)) }}
  - if:
      - condition: template
        value_template: "{{ hold_mode not in (state_attr(battery_mode, 'options') or []) }}"
    then:
      - stop: >-
          The entity chosen as battery mode does not offer this mode.
          Choose the Battery mode entity of the battery.
        error: true
  # Three attempts 30 seconds apart, then one every five minutes, for
  # two hours in all. A battery that is not given back would stay in
  # the mode for good on an inverter without a revert time, so giving
  # up early is not an option. After each wait the loop looks again
  # whether the mode is still wanted, and ends when it is not.
  #
  # "written" only turns true when the action did not fail, because a
  # failed action ends the inner sequence.
  - repeat:
      while:
        - condition: template
          value_template: "{{ not written and wanted and repeat.index <= 27 }}"
      sequence:
        # Looked at before every attempt, the first one too: this run
        # may have waited in the queue behind another one.
        - variables:
            runs_now: >-
              {{ (states(load) | float(0)
                  * (1000 if state_attr(load, 'unit_of_measurement') == 'kW' else 1)
                  > power_threshold)
                 if load.startswith('sensor.') else is_state(load, 'on') }}
        - variables:
            # Giving the battery back is wanted while the consumer is
            # off and the battery is still held. Holding it is wanted
            # while the consumer runs and nothing else took the battery.
            wanted: >-
              {{ (not runs_now and states(battery_mode) in held_modes)
                 if target == 'auto'
                 else (runs_now and states(battery_mode) in ['auto'] + held_modes) }}
        - if:
            - condition: template
              value_template: "{{ wanted }}"
          then:
            - sequence:
                - action: select.select_option
                  target:
                    entity_id: "{{ battery_mode }}"
                  data:
                    option: "{{ target }}"
                - variables:
                    written: true
              continue_on_error: true
            - if:
                - condition: template
                  value_template: >-
                    {{ not written and repeat.index == 3 and notify_entities | length > 0 }}
              then:
                - action: notify.send_message
                  continue_on_error: true
                  target:
                    entity_id: "{{ notify_entities }}"
                  data:
                    title: "{{ state_attr(battery_mode, 'friendly_name') }}"
                    message: >-
                      The battery mode could not be set in three attempts.
                      The automation keeps trying every five minutes for two
                      hours.
            - if:
                - condition: template
                  value_template: "{{ not written and repeat.index < 27 }}"
              then:
                - delay:
                    seconds: "{{ 30 if repeat.index < 3 else 300 }}"
  # The inverter reports the mode it is in, and that can be another
  # one than the mode selected: with a power of 0 W in one of the power
  # fields, for example. This automation would not know such a mode as
  # its own and would never end it. So it is taken back at once.
  - if:
      - condition: template
        value_template: "{{ written and target != 'auto' }}"
    then:
      - wait_template: "{{ states(battery_mode) in held_modes }}"
        timeout:
          seconds: 60
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{ not wait.completed
                 and states(battery_mode) not in ['auto', 'unavailable', 'unknown'] }}
        then:
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ battery_mode }}"
            data:
              option: auto
          - if:
              - condition: template
                value_template: "{{ notify_entities | length > 0 }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: "{{ notify_entities }}"
                data:
                  title: "{{ state_attr(battery_mode, 'friendly_name') }}"
                  message: >-
                    The inverter reports another mode than the one selected for the
                    consumer, so the automation selected Automatic again. Check
                    the power in Battery PV charge limit and Battery discharge
                    limit: 0 W changes what a mode does.
          - stop: The inverter reports another battery mode than the one selected.
            error: true
  - if:
      - condition: template
        value_template: "{{ written and notify_entities | length > 0 and reason != 'refresh' }}"
    then:
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id: "{{ notify_entities }}"
        data:
          title: "{{ state_attr(battery_mode, 'friendly_name') }}"
          message: >-
            {% set consumer = state_attr(load, 'friendly_name') or load %}
            {{ 'The battery is back to automatic: ' ~ consumer ~ ' is off.'
               if target == 'auto'
               else ('The battery does not discharge while ' ~ consumer ~ ' runs.'
                     if hold_mode == 'block_discharging'
                     else 'The battery discharge is limited while ' ~ consumer ~ ' runs.') }}
  # Still not set although it is still wanted: the two hours are over.
  - if:
      - condition: template
        value_template: "{{ not written and wanted }}"
    then:
      - if:
          - condition: template
            value_template: "{{ notify_entities | length > 0 }}"
        then:
          - action: notify.send_message
            continue_on_error: true
            target:
              entity_id: "{{ notify_entities }}"
            data:
              title: "{{ state_attr(battery_mode, 'friendly_name') }}"
              message: >-
                The battery mode could not be set for two hours. The
                automation has given up. Check the inverter and select the
                mode by hand.
      - stop: The inverter did not take the battery mode for two hours.
        error: true
