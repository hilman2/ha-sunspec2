# The rules of Home Assistant's integration quality scale, and where this
# integration meets each one. Home Assistant grades only its own core
# integrations and hassfest does not read this file for a custom one, so
# the rating in manifest.json is this project's own assessment.
#
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      services.py registers ``sunspec2.set_export_limit`` and
      ``sunspec2.set_battery_plan`` from ``async_setup``, each with a
      schema. Their fields are described in services.yaml.
  appropriate-polling:
    status: done
    comment: |
      A DataUpdateCoordinator polls at the interval the user sets
      (30 s by default, not below MIN_SCAN_INTERVAL_SECONDS).
  brands:
    status: done
    comment: |
      The brand/ folder ships with the integration.
  common-modules:
    status: done
    comment: |
      The coordinator is in coordinator.py, the entity base class in
      entity.py. The second coordinator, for the Fronius web interface,
      is in fronius_web.py next to the client it polls.
  config-flow:
    status: done
    comment: |
      Setup is in the UI only: network or serial connection, then the
      models to read. Options, reconfigure and DHCP discovery have
      their own steps. Every field has a description.
  config-flow-test-coverage:
    status: done
    comment: |
      tests/test_config_flow.py runs every step of the flow, the
      options flow and reconfigure, with their error branches.
  dependency-transparency:
    status: done
    comment: |
      Two requirements, both on PyPI: modbus-connection
      (home-assistant-libs, Apache 2.0) and the tmodbus backend it
      uses (wlcrs, BSD 3-Clause). The SunSpec client is an embedded
      fork of pysunspec2 (Apache 2.0); its origin and every change are
      recorded in pysunspec2/__init__.py.
  docs-actions:
    status: done
    comment: |
      docs/write-controls.md describes ``set_export_limit``,
      docs/fronius.md ``set_battery_plan``.
  docs-conditions:
    status: exempt
    comment: |
      The integration has no conditions of its own.
  docs-high-level-description:
    status: done
    comment: |
      The opening of the README.
  docs-installation-instructions:
    status: done
    comment: |
      README, "Installation".
  docs-removal-instructions:
    status: done
    comment: |
      README, "Removing it".
  docs-triggers:
    status: exempt
    comment: |
      The integration has no triggers of its own.
  entity-event-setup:
    status: exempt
    comment: |
      The integration polls. It subscribes to no events of a library.
  entity-unique-id:
    status: done
    comment: |
      ``get_sunspec_unique_id`` in entity.py: entry id, point key,
      model id and model index.
  has-entity-name:
    status: done
    comment: |
      SunSpecEntity sets _attr_has_entity_name. An entity names only
      itself ("AC power"); the device name, built from the Md field of
      common model 1 and the model label, goes in front.
  runtime-data:
    status: done
    comment: |
      The coordinator is ``entry.runtime_data``, typed through
      ``SunSpec2ConfigEntry``.
  test-before-configure:
    status: done
    comment: |
      The flow connects and scans the device before it creates the
      entry, and shows a transport, protocol or device error on the
      form.
  test-before-setup:
    status: done
    comment: |
      ``async_setup_entry`` awaits ``async_config_entry_first_refresh``.
      A device that does not answer raises ConfigEntryNotReady.
  unique-config-entry:
    status: done
    comment: |
      The unique id is the serial number from common model 1, or
      host, port and unit id for a device that reports none.

  # Silver
  action-exceptions:
    status: done
    comment: |
      Both actions and every entity that writes raise
      HomeAssistantError for a failed write, an entry that is not
      loaded or a device without the control.
  config-entry-unloading:
    status: done
    comment: |
      ``async_unload_entry`` unloads the platforms it forwarded, shuts
      the coordinator and its Modbus session down and removes the
      update listener. Home Assistant releases the entry's hold on the
      shared connection.
  docs-configuration-parameters:
    status: done
    comment: |
      README, "Options".
  docs-installation-parameters:
    status: done
    comment: |
      README, "Installation".
  entity-unavailable:
    status: done
    comment: |
      ``SunSpecEntity.available`` turns False once more than
      STALE_DATA_TOLERANCE_CYCLES update cycles in a row have failed.
      Up to then an entity keeps its last value on purpose, so a short
      dropout does not put gaps into the statistics.
  integration-owner:
    status: done
    comment: |
      ``codeowners`` in manifest.json.
  log-when-unavailable:
    status: done
    comment: |
      The coordinator logs a warning when an update cycle fails for
      the first time and one when the device answers again. The
      failed cycles in between log at debug, with their count, and so
      does a setup that fails, which Home Assistant reports itself.
  parallel-updates:
    status: done
    comment: |
      Every platform sets ``PARALLEL_UPDATES = 0``. The coordinator
      already serialises reads and writes with a lock per gateway.
  reauthentication-flow:
    status: exempt
    comment: |
      Modbus has no authentication. The optional login to the Fronius
      web interface is entered in the options and replaced there.
  test-coverage:
    status: done
    comment: |
      The pytest job in CI measures coverage of the whole integration,
      the embedded pysunspec2 included, and fails below 95 %
      ([tool.coverage.report] in pyproject.toml).

  # Gold
  devices:
    status: done
    comment: |
      One device per SunSpec model of an entry, plus the devices a
      vendor profile adds (battery, gateway).
  diagnostics:
    status: done
    comment: |
      diagnostics.py. The host and the Fronius web token are redacted
      in the entry data, and the host and every IPv4 address in the
      error texts. The readings are dumped as the device sent them.
  discovery-update-info:
    status: todo
    comment: |
      Not automatic. An entry is identified by the serial number of
      the device, which DHCP discovery does not carry. A device found
      at a new address updates the host of its entry only once the
      user confirms the discovered device and the flow has read the
      serial number. Until then the host is changed through
      "Reconfigure".
  discovery:
    status: done
    comment: |
      DHCP discovery by the MAC prefixes in manifest.json, and a scan
      of the local network the user starts from the first form (at
      most a /22).
  docs-data-update:
    status: done
    comment: |
      README, "How the integration reads your inverter".
  docs-examples:
    status: done
    comment: |
      README, "Adding it to the Energy dashboard". The vendor pages
      under docs/ have automations.
  docs-known-limitations:
    status: done
    comment: |
      README, "Limitations".
  docs-supported-devices:
    status: done
    comment: |
      README, "Will it work with my inverter?".
  docs-supported-functions:
    status: done
    comment: |
      README, the list under "What you get" and "Battery and export
      control"; docs/write-controls.md and the vendor pages for the
      controls.
  docs-troubleshooting:
    status: done
    comment: |
      README, "When something is wrong", and docs/troubleshooting.md.
  docs-use-cases:
    status: done
    comment: |
      README, the list under "What you get".
  dynamic-devices:
    status: done
    comment: |
      A coordinator listener adds the sensors of a model that appears
      after setup, without a reload. The controls of such a model come
      with the next reload.
  entity-category:
    status: done
    comment: |
      Temperatures, operating states and event bitfields are
      diagnostic.
  entity-device-class:
    status: done
    comment: |
      ``HA_META`` in sensor.py maps a SunSpec unit to its device class.
  entity-disabled-by-default:
    status: done
    comment: |
      Vendor event bitfields, the vendor operating state and the
      nameplate and settings values are disabled by default, and so is
      the switch that disconnects the inverter from the grid.
  entity-translations:
    status: done
    comment: |
      Every entity the integration defines itself has a translation
      key, with its name in translations/en.json and de.json. The
      generic SunSpec sensors do for the points in
      SUNSPEC_POINT_TRANSLATION_KEYS (sensor.py), in the models where
      the point means what the translation says. Any other SunSpec
      point is named by the label of its model definition, which
      exists in English only, and a point in a repeating group keeps
      that label with its index.
  exception-translations:
    status: done
    comment: |
      Every error an action or an entity raises for the user goes
      through ``errors.user_error`` and has its message under
      ``exceptions`` in translations/en.json and de.json.
      tests/test_errors.py compares the keys and placeholders.
  icon-translations:
    status: todo
    comment: |
      icons.json has the icons of the 37 translated SunSpec sensors.
      The controls and the vendor entities still set their icon in
      code.
  reconfiguration-flow:
    status: done
    comment: |
      ``async_step_reconfigure`` changes host, port and unit id. It
      probes the new address and refuses a device with another serial
      number.
  repair-issues:
    status: done
    comment: |
      The coordinator raises an issue for a protocol error at once,
      for a transport or device error after three in a row, and for a
      model that stopped answering. cjne/ha-sunspec still running for
      the same device raises one as well. Each clears itself.
  stale-devices:
    status: done
    comment: |
      ``async_remove_config_entry_device`` lets the user remove a
      device. Whether a model is gone for good or only missing while
      the inverter sleeps cannot be told from here.
