[project]
name = "ha-sunspec2"
version = "0.7.0"
description = "Home Assistant custom integration for SunSpec Modbus devices, brownfield rewrite of cjne/ha-sunspec."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [{ name = "hilman2" }]
keywords = ["home-assistant", "homeassistant", "sunspec", "modbus", "solar", "inverter", "kaco"]

[project.urls]
Homepage = "https://github.com/hilman2/ha-sunspec2"
Issues = "https://github.com/hilman2/ha-sunspec2/issues"

# ----------------------------------------------------------------------------
# ruff: lint configuration
# ----------------------------------------------------------------------------
# This project is a HA custom integration. We follow the same baseline rules
# as HA core (E, F, W, B, UP, I) but stay relaxed about a few things that
# legacy carryover from cjne would otherwise trip on (line length, some
# bug-bear rules). Type correctness is not ruff's job here, it is mypy's;
# see the [tool.mypy] section at the bottom of this file.

[tool.ruff]
# Deliberately one release behind requires-python. At py314 the formatter
# applies PEP 758 and rewrites every "except (A, B):" to "except A, B:",
# which is 15 lines of pure churn across 7 files for a spelling that reads
# like the Python 2 "except E, name:" exception binding. The runtime and
# mypy are on 3.14; only the formatter is asked to stay conservative.
target-version = "py313"
line-length = 100
extend-exclude = [
    "tests/test_data",
    # The embedded pysunspec2 fork and the upstream tests that came with it.
    # Verbatim from upstream apart from the import paths, in upstream's own
    # style, so linting or formatting them would only bury the origin diff.
    "custom_components/sunspec2/pysunspec2",
    "tests/pysunspec2",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "B",     # flake8-bugbear (catches a lot of real bugs)
    "I",     # isort (import sort order)
    "UP",    # pyupgrade (modern Python idioms)
    "SIM",   # flake8-simplify (catches dead code, redundant if-else)
]
ignore = [
    "E501",  # line too long - we use a soft 100 char limit but allow longer
    "B008",  # function call as default argument - common in HA decorators
    "SIM108",# ternary if/else can be cleaner as full if-else for readability
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to break a few rules for clarity:
# - F401: unused imports (fixtures look unused but are loaded by pytest)
# - F811: redefined names (parametrize patterns)
"tests/**" = ["F401", "F811", "B011", "B017"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["custom_components.sunspec2"]
combine-as-imports = false

# ----------------------------------------------------------------------------
# pytest configuration
# ----------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ----------------------------------------------------------------------------
# mypy: static type checking
# ----------------------------------------------------------------------------
# The integration runs under --strict, the test suite does not.
#
# The reason for the split is what each body of code is for. Every value in
# custom_components/ crosses a boundary that mypy is the only thing watching:
# a Modbus register comes back as an untyped value from pysunspec2, travels
# through the coordinator, and ends up in a Home Assistant entity property
# whose contract HA enforces at runtime with a ValueError. A wrong type there
# surfaces as a broken sensor in someone's dashboard. In tests, a wrong type
# surfaces as a failing test, which is what tests are for, so the strictness
# would buy little and would cost a signature on every fixture.
#
# The embedded pysunspec2 is untyped, so everything crossing that boundary is
# Any. Rather than let the Any spread inward, api.py and models.py annotate
# their own return types and mypy checks the rest of the codebase against those.
# That is why warn_return_any stays on: it is the rule that catches a
# pysunspec2 value being passed through unnoticed.

[tool.mypy]
python_version = "3.14"
files = ["custom_components", "tests"]
strict = true
# HA's own decorators (@callback, @property overrides) are typed, so untyped
# decorators are a sign of our own code, not of the framework.
disallow_untyped_decorators = true
# Path-based invocation ("mypy" with no arguments) needs the namespace layout
# because custom_components/ is a HA drop-in directory, not an installed package.
namespace_packages = true
explicit_package_bases = true
# The embedded pysunspec2 fork and the upstream tests that came with it are
# untyped and stay that way; see the override below for how their imports
# are treated. The exclude keeps them out of the file walk.
exclude = [
    "^custom_components/sunspec2/pysunspec2/",
    "^tests/pysunspec2/",
]

# The HA test plugin ships no type information. Without this, every import
# from it is an error before mypy looks at a single line of ours.
[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true

# Whatever our code imports from the embedded pysunspec2 is Any, exactly as
# it was when the library came from pip without a py.typed marker. Following
# the import instead would type every client call in api.py against untyped
# definitions, and strict mode rejects a call to an untyped function.
[[tool.mypy.overrides]]
module = [
    "custom_components.sunspec2.pysunspec2",
    "custom_components.sunspec2.pysunspec2.*",
    "tests.pysunspec2",
    "tests.pysunspec2.*",
]
follow_imports = "skip"
ignore_errors = true

# Tests: bodies are checked, signatures are not required. What is switched
# off below is test idiom, not type looseness:
#
# - subclassing Any: the fixtures subclass pysunspec2's FileClientDevice,
#   which has no type information at all, so mypy sees an Any base class.
# - method-assign: several tests replace a bound method on a client to drive
#   a specific failure. Rewriting those as mocker.patch.object would change
#   what they test, not how they are typed.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_subclassing_any = false
warn_return_any = false
disable_error_code = ["method-assign"]
