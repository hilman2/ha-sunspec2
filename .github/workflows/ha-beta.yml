# Early warning for the next Home Assistant release.
#
# The CI gate tests against stable, because a broken upstream beta must
# not turn somebody's pull request red. This workflow runs the same suite
# against the beta once a week and reports on an issue of its own. HA
# betas run for roughly two weeks, so a weekly run sees every one of them
# before it ships.
#
# Deliberately not a required check. It never blocks a merge.
name: HA beta

on:
  schedule:
    # Mondays, 05:00 UTC. Nothing depends on the hour.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ISSUE_LABEL: ha-beta

jobs:
  beta:
    name: pytest against the HA beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Resolve Home Assistant version
        id: ha
        run: python .github/scripts/resolve_ha_versions.py --channel beta

      - name: Install dependencies
        # Same two-step install as the pytest job in ci.yml, same reasons.
        # The comments are there.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "homeassistant==${{ steps.ha.outputs.ha }}" \
            "pytest-homeassistant-custom-component==${{ steps.ha.outputs.phcc }}" \
            pytest-mock \
            voluptuous-serialize \
            "pyserial==3.5"
          pip install "pytest<9"

      - name: Run tests
        id: tests
        # Held rather than allowed to end the job, so the steps below can
        # tell a failing test from a failing checkout or an unreachable
        # PyPI. Only the first of those deserves an issue. The last step
        # fails the run either way.
        continue-on-error: true
        run: pytest tests/ -q

      - name: Report the failure on an issue
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          HA_VERSION: ${{ steps.ha.outputs.ha }}
          PHCC_VERSION: ${{ steps.ha.outputs.phcc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$ISSUE_LABEL" \
            --color FBCA04 \
            --description "Tests against the next Home Assistant beta" \
            2>/dev/null || true

          body=$(cat <<EOF
          The test suite fails against Home Assistant \`$HA_VERSION\`, which
          is the current beta. Stable is unaffected, the CI gate is green.

          Run: $RUN_URL
          Resolved by \`pytest-homeassistant-custom-component==$PHCC_VERSION\`.

          A Home Assistant beta runs for about two weeks. Fixing this
          before it goes stable is what keeps the release from breaking
          for users on day one.

          This issue is updated by the weekly \`HA beta\` workflow and
          closes itself once the run is green again.
          EOF
          )

          number=$(gh issue list --label "$ISSUE_LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')

          if [ -n "$number" ]; then
            # Updated rather than commented on: a weekly comment on a
            # months-old beta issue is noise, the current state is not.
            gh issue edit "$number" \
              --title "Tests fail against Home Assistant $HA_VERSION (beta)" \
              --body "$body"
            echo "updated issue #$number"
          else
            gh issue create \
              --title "Tests fail against Home Assistant $HA_VERSION (beta)" \
              --label "$ISSUE_LABEL" \
              --body "$body"
          fi

      - name: Close the issue if the beta is green again
        if: steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HA_VERSION: ${{ steps.ha.outputs.ha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --label "$ISSUE_LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" \
              --comment "Green against Home Assistant $HA_VERSION. $RUN_URL"
            echo "closed issue #$number"
          else
            echo "nothing to close"
          fi

      - name: Fail the run if the tests failed
        # So the workflow shows red in the Actions list and GitHub sends
        # its own failure mail, on top of the issue.
        if: steps.tests.outcome == 'failure'
        run: exit 1
