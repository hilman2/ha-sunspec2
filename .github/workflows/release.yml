name: Release

# Tag push is the trigger. The workflow refuses to publish a release
# until the CI workflow on the same commit has finished green, so a
# broken main can never accidentally ship to HACS users via a
# manually-cut tag.
#
# Versions follow Home Assistant's calendar scheme, YEAR.MONTH.PATCH,
# with a v in front of the tag. Two kinds of tag:
#
#   v2026.9.0     a release. Published as the latest release, which is
#                 what HACS offers every user as an update.
#   v2026.9.0b1   a pre-release: anything after the three numbers,
#                 b1 and rc1 as Home Assistant spells them, or -rc1.
#                 Published with the pre-release flag and never as
#                 latest. HACS shows it only to users who tick "Show
#                 beta versions" in the redownload dialog, so a build
#                 can be tried on real hardware without reaching
#                 everyone else.
#
# Both must carry the version that manifest.json declares, suffix
# aside; the check below refuses a tag that does not.
#
# The complementary half of this gate lives in the branch protection
# rules on `main` (required status checks for the five CI jobs). Tags
# can only sit on commits that already passed CI, but this workflow
# also re-verifies that at release time as a belt-and-braces check.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  verify-and-release:
    name: Verify CI green and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse if CI on this commit is not green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          echo "Verifying CI status for tag commit $SHA"

          # The CI workflow on `main` typically starts within seconds
          # of the parent main push, which is moments before any
          # tag push. Allow up to ten minutes for it to finish so
          # back-to-back "merge then tag" sequences are tolerated.
          for i in $(seq 1 60); do
            RUN=$(gh run list \
              --commit "$SHA" \
              --workflow "CI" \
              --json status,conclusion,databaseId \
              --limit 1 \
              --jq '.[0]')

            if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
              echo "Attempt $i/60: no CI run yet for $SHA, sleeping 10s..."
              sleep 10
              continue
            fi

            STATE=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')

            if [ "$STATE" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI for $SHA is green - proceeding to release"
                exit 0
              fi
              echo "::error::CI for $SHA finished with conclusion=$CONCLUSION - refusing to publish release"
              exit 1
            fi

            echo "Attempt $i/60: CI status=$STATE, waiting 10s..."
            sleep 10
          done

          echo "::error::Timed out waiting for CI on $SHA to complete"
          exit 1

      - name: Refuse if the tag does not match manifest.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # v2026.9.0b1 -> 2026.9.0: drop the leading v and whatever
          # follows the three numbers.
          WANT=$(printf '%s' "$TAG" | sed -E 's/^v//; s/^([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
          HAVE=$(jq -r .version custom_components/sunspec2/manifest.json)
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::Tag $TAG names version $WANT but manifest.json says $HAVE"
            exit 1
          fi
          echo "Tag $TAG matches manifest version $HAVE"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # release-drafter keeps a draft up to date as PRs land on
            # main. If one already exists for this tag, publish it
            # as-is so the curated changelog survives. Otherwise
            # create a fresh release with auto-generated notes.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Existing release $TAG found - publishing as latest"
              gh release edit "$TAG" --draft=false --latest
            else
              echo "No existing release for $TAG - creating one with auto-generated notes"
              gh release create "$TAG" \
                --title "$TAG" \
                --generate-notes \
                --latest
            fi
          else
            # A pre-release never touches the release-drafter draft,
            # which is waiting for the final tag, and never becomes
            # latest. Notes are generated from the commits since the
            # previous release.
            echo "Pre-release tag $TAG - publishing with the pre-release flag"
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --prerelease
          fi
