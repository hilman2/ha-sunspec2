# The draft carries a placeholder name. Versions follow the calendar
# (2026.9.0, see release.yml), which release-drafter cannot compute: it
# only knows how to bump the previous tag semver-style. The release
# workflow publishes this draft under whatever final tag is pushed and
# appends the compare link then, so neither needs the version here.
name-template: "Next release"
tag-template: "next"
template: |
  ## What's Changed

  $CHANGES

categories:
  - title: "Breaking changes"
    labels:
      - "breaking"
      - "major"
  - title: "New features"
    labels:
      - "feature"
      - "enhancement"
  - title: "Bug fixes"
    labels:
      - "bug"
      - "fix"
  - title: "Maintenance"
    labels:
      - "chore"
      - "refactor"
  - title: "Documentation"
    labels:
      - "documentation"
      - "docs"
  - title: "Tests"
    labels:
      - "test"
  - title: "Dependencies"
    labels:
      - "dependencies"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

# Auto-label PRs based on conventional commits in the title
autolabeler:
  - label: "breaking"
    title:
      - '/^(feat|fix|chore|refactor|docs)!:/i'
  - label: "feature"
    title:
      - '/^feat(\(.*\))?:/i'
  - label: "bug"
    title:
      - '/^fix(\(.*\))?:/i'
  - label: "chore"
    title:
      - '/^chore(\(.*\))?:/i'
  - label: "refactor"
    title:
      - '/^refactor(\(.*\))?:/i'
  - label: "docs"
    title:
      - '/^docs(\(.*\))?:/i'
  - label: "test"
    title:
      - '/^test(\(.*\))?:/i'
  - label: "ci"
    title:
      - '/^ci(\(.*\))?:/i'
